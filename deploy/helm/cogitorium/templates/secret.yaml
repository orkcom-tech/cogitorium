{{- /*
The admin's password, and why this template computes rather than copies.

Left unset, the operator gets one GENERATED here — because the alternative on a
cluster is worse in both directions. An admin with no password makes the server
offer its first-run setup screen, and on an address the network can reach that
screen demands the admin token precisely so a stranger cannot claim the install;
so an unattended deploy would come up needing a human to go and fetch a token
before anybody could sign in at all.

TWO THINGS ABOUT GENERATING IT THAT ARE NOT STYLE:

  1. It must survive `helm upgrade`. randAlphaNum runs on every render, so a
     naive generation would put a new password in the Secret at every upgrade —
     and the server only adopts a supplied password when the admin has none, so
     from the second upgrade onward the Secret would advertise a value that does
     not work. lookup reads what is already deployed and keeps it.

  2. lookup returns NOTHING under `helm template`, `--dry-run`, and on a first
     install — there is no cluster to ask, or nothing in it yet. That is correct
     for the first install and means a dry run shows a password that is not the
     one a real install would keep. It is a rendering preview, not a credential.

And it is NOT printed in NOTES.txt, which cannot be done even if it were wise:
Helm renders each template separately, so a randAlphaNum there would produce a
different string from this one. NOTES gives the command to read this back.
*/ -}}
{{- $secretName := printf "%s-auth" (include "cogitorium.fullname" .) -}}
{{- $ownSecret := not .Values.auth.existingSecret -}}
{{- $password := .Values.auth.adminPassword -}}
{{- if and $ownSecret (not $password) -}}
  {{- $prior := lookup "v1" "Secret" .Release.Namespace $secretName -}}
  {{- $priorData := (default (dict) (get (default (dict) $prior) "data")) -}}
  {{- if hasKey $priorData "admin-password" -}}
    {{- $password = get $priorData "admin-password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
{{- if or $password (and .Values.auth.adminToken $ownSecret) (and .Values.config.egressKey (not .Values.config.egressExistingSecret)) (and .Values.config.secretKey (not .Values.config.secretKeyExistingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{- include "cogitorium.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $password }}
  admin-password: {{ $password | quote }}
  {{- end }}
  {{- if and .Values.auth.adminToken $ownSecret }}
  admin-token: {{ .Values.auth.adminToken | quote }}
  {{- end }}
  {{- if and .Values.config.egressKey (not .Values.config.egressExistingSecret) }}
  egress-key: {{ .Values.config.egressKey | quote }}
  {{- end }}
  {{- if and .Values.config.secretKey (not .Values.config.secretKeyExistingSecret) }}
  secret-key: {{ .Values.config.secretKey | quote }}
  {{- end }}
{{- end }}
