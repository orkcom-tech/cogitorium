{{- include "cogitorium.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cogitorium.fullname" . }}
  labels: {{- include "cogitorium.labels" . | nindent 4 }}
data:
  # Everything here is readable by anything that can read this namespace, which
  # is why no credential appears in it. Keys and the admin token arrive as
  # environment variables from a Secret.
  config.yaml: |
    listen: 0.0.0.0:{{ .Values.service.port }}
    data_dir: /data
    log_level: {{ .Values.config.logLevel }}
    contextd_path: contextd
    sandbox: {{ .Values.config.sandbox }}
    {{- if .Values.config.sandboxImage }}
    sandbox_image: {{ .Values.config.sandboxImage }}
    {{- end }}
    {{- if eq .Values.config.sandbox "kubernetes" }}
    # The claim and the node are NOT here: one is the release's own name and the
    # other is only known to the kubelet, so both arrive as environment
    # variables from the deployment instead.
    kube_cpu: {{ .Values.config.gearResources.cpu | quote }}
    kube_memory: {{ .Values.config.gearResources.memory | quote }}
    {{- end }}
    terminal: {{ .Values.config.terminal }}
    update_check: {{ .Values.config.updateCheck | quote }}
    {{- if .Values.metrics.enabled }}
    # All interfaces INSIDE THE POD, which is not the same as all interfaces on
    # a machine: nothing reaches this but the cluster network, and the
    # NetworkPolicy decides who on it may. A loopback bind here would be
    # unscrapable, which is the mistake that makes people give up and put
    # /metrics on the API.
    metrics_listen: "0.0.0.0:{{ .Values.metrics.port }}"
    {{- end }}
    log_format: {{ .Values.config.logFormat | quote }}
    egress: {{ .Values.config.egress }}
    {{- if .Values.config.variablesConfigMap }}
    variables_dir: /etc/cogitorium/variables
    {{- end }}
    {{- if .Values.config.secretsSecret }}
    secrets_dir: /etc/cogitorium/secrets
    {{- end }}
