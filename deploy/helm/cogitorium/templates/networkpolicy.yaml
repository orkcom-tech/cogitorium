{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cogitorium.fullname" . }}
  labels: {{- include "cogitorium.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cogitorium.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    {{- if .Values.networkPolicy.allowFrom }}
    - from: {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    # Nothing listed: nothing may reach it. An empty ingress rule set denies
    # all inbound traffic, which is the safe reading of "enabled but not
    # configured" — the alternative silently allows everything.
    []
    {{- end }}
  # Egress is deliberately unrestricted: the server must reach whichever model
  # providers the operator configured, and this chart cannot know their
  # addresses. Restricting it belongs in a policy written against those.
{{- end }}
