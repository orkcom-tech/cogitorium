{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cogitorium.serviceAccountName" . }}
  labels: {{- include "cogitorium.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The server never calls the Kubernetes API. Agent-authored code runs in this
# pod today, so a mounted token would be a cluster credential inside the blast
# radius of a gear.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
