# Cogitorium — Helm values.
#
# Read the two blocks marked "cannot be changed" before anything else. They are
# not preferences; they are consequences of how the software stores its data and
# how it executes agent-authored code.

image:
  repository: ghcr.io/orkcom-tech/cogitorium
  # Empty means the chart's appVersion, so `helm upgrade` after a chart bump
  # does not silently keep an old image.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# CANNOT BE CHANGED: one replica
#
# Everything is stored in SQLite with a single writer. Two pods on one volume
# corrupt the database — not "may", will. There is no replicaCount value here on
# purpose: a number you can raise is a number somebody raises during an
# incident. Horizontal scale needs a different store behind the same package,
# which is a project rather than a flag.
# ─────────────────────────────────────────────────────────────────────────────

persistence:
  enabled: true
  # ReadWriteOnce, and it must stay that way for the same reason as the replica
  # count. ReadWriteMany here would not enable scaling; it would only remove the
  # thing currently preventing two writers.
  accessMode: ReadWriteOnce
  size: 20Gi
  storageClass: ""
  # An existing claim, if the data already exists and you are re-deploying.
  existingClaim: ""

service:
  type: ClusterIP
  port: 8688
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cogitorium.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ─────────────────────────────────────────────────────────────────────────────
# Credentials.
#
# Nothing sensitive belongs in the ConfigMap: a ConfigMap is not a secret, it is
# readable by anything that can read the namespace, and it ends up in
# `helm get values` output and in whatever GitOps repository rendered it.
# ─────────────────────────────────────────────────────────────────────────────
auth:
  # The first admin's token. Supply it and nothing sensitive is ever printed;
  # leave it empty and the server generates one and logs it ONCE at first
  # start — which on Kubernetes means it sits in the pod log for anyone who can
  # read logs. At least 24 characters; the server refuses to start otherwise.
  #
  #   kubectl create secret generic cogitorium-auth \
  #     --from-literal=admin-token="$(openssl rand -hex 24)"
  adminToken: ""
  # Or point at a Secret you already made. Takes precedence over adminToken.
  existingSecret: ""
  existingSecretKey: admin-token

config:
  logLevel: info

  # ───────────────────────────────────────────────────────────────────────────
  # How gears execute
  #
  # "kubernetes" runs each gear as a Job that mounts the SAME volume the data
  # directory is on, with subPath set to that run's own directory — so the gear
  # sees its payload at /work and nothing else on the volume. Not the SQLite
  # database, not the provider keys in it, not another workspace's files. The
  # kubelet enforces that before the container starts.
  #
  # It needs three things this chart provides: a Role letting the server create
  # Jobs in its own namespace, a mounted service account token to use it, and
  # the node name from the downward API — a ReadWriteOnce volume attaches to one
  # node, so a Job scheduled elsewhere would wait forever on a volume it cannot
  # have.
  #
  # "subprocess" is what this chart could offer before that existed: gears run
  # as a child of the server, holding the server's own file access. It is still
  # here because a cluster whose policy forbids the Role above has to be able to
  # deploy — but on that setting, approving a gear grants it everything the
  # server has, and the terminal and the outward gate stay refused. Note also
  # that this image carries no python3, node or bash — they belong to the gear's
  # own container — so on "subprocess" only a "binary" gear can run at all.
  # ───────────────────────────────────────────────────────────────────────────
  sandbox: kubernetes

  # The image gears run in. Empty means the server's own default.
  sandboxImage: ""

  # Bounds one gear Job. Empty means the cluster's own defaults.
  gearResources:
    cpu: "1"
    memory: 512Mi

  # The in-UI shell. It needs a sandbox and the chart refuses it without one —
  # interactive code execution with the server's file access is not something a
  # value should be able to turn on.
  terminal: false

  # May this install ask GitHub whether a newer Cogitorium or Contextverse has
  # been released: "ask", "on" or "off".
  #
  # "off" HERE, and not the "ask" the binary defaults to. A cluster is not a
  # laptop: the question is put to whoever is looking at the interface, and on
  # Kubernetes the person who decides what this pod may reach is the person
  # applying this chart, not the person who happens to open a browser. Set it to
  # "on" if you want the notice; the notice is the whole feature here anyway,
  # because the image tag is the version and there is no command a pod could run
  # that the next roll would not undo.
  #
  # Nothing about the install is ever sent — no identifier, no version, no
  # count. See the guide's Updates section.
  updateCheck: "off"

  # Agents reaching the internet. Off by default, and it needs a sandbox: an
  # unsandboxed gear can rewrite the configuration and the grants table, which
  # would make the gate decorative.
  egress: false
  egressKey: ""
  egressExistingSecret: ""
  egressExistingSecretKey: egress-key

  # Named values a gear may be given. The gear declares the NAMES it needs and
  # is handed the values in its environment; nothing here ever reaches a model.
  #
  # Both are mounted as directories, one file per name, which is exactly the
  # shape a ConfigMap and a Secret take when they are mounted. Rotation is
  # therefore the cluster's own — update the object and the files change under
  # a running server. This chart deliberately does NOT let the server read the
  # cluster API for these: that would need a service account token in the pod,
  # and gears currently run as a subprocess of the server, so agent-authored
  # code would hold it. serviceAccount.automount stays false for the same
  # reason.
  #
  #   kubectl create configmap cogitorium-variables --from-literal=REGION=eu-west-1
  #   kubectl create secret generic cogitorium-secrets --from-literal=S3_KEY=...
  #
  # A variable is shown wherever it appears; a secret is redacted everywhere the
  # software could otherwise surface it. Which one a name is comes from which of
  # these it was mounted from, so putting a credential in the ConfigMap makes it
  # a variable — visible in runs and logs.
  variablesConfigMap: ""
  secretsSecret: ""

  # Encrypts secrets stored in THIS INSTALL'S OWN database — the ones set
  # through the interface. Values mounted from secretsSecret above need no key,
  # because they are never written here.
  #
  # It has no config-file key on purpose: the config file above is a ConfigMap,
  # and a key sitting beside its own ciphertext protects nothing. Leave it empty
  # and the install still works — only storing a secret in the database is
  # refused, and it says why.
  secretKey: ""
  secretKeyExistingSecret: ""
  secretKeyExistingSecretKey: secret-key

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    # No CPU limit by default: a turn is mostly waiting on a model API, and a
    # limit here buys throttling rather than protection. Memory is capped
    # because a runaway is the failure worth bounding.
    memory: 2Gi

# The server runs as an unprivileged user with a read-only root filesystem; the
# data directory is the only writable path, and it is a volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# A default-deny ingress policy, so only what you name can reach the server.
# Egress is left alone: the server has to reach the model providers you
# configured, and this chart cannot know their addresses.
networkPolicy:
  enabled: false
  # Namespaces and pods allowed to reach the service.
  allowFrom: []

# Cuts egress for gear Jobs the operator did not grant the network. Enabled by
# default because "no network unless granted" is what the product promises
# everywhere else — but a NetworkPolicy is enforced by the CNI plugin, not by
# Kubernetes, and on a cluster whose CNI ignores them (kindnet, plain flannel)
# this object is accepted and enforces nothing. Check yours; treat an ungranted
# gear as networked until you have.
gearNetworkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Required by sandbox: kubernetes — the server creates a Job per gear run, and
  # that is what it authenticates with. It is no longer a credential inside a
  # gear's blast radius: the gear runs in its own pod, and that pod sets
  # automountServiceAccountToken: false, so agent-authored code holds no token
  # at all. Set this to false only alongside sandbox: subprocess.
  automountServiceAccountToken: true

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
