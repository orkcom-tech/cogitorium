name: ci

# The interface is embedded in the binary, so a Go-only build proves nothing:
# every job here builds the UI first. `go:embed all:dist` matching nothing is a
# compile error, which is what makes a fresh clone either work or fail loudly.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      # The race detector needs cgo, and with cgo on this runner `go test ./...`
      # also compiles the desktop command, which needs the system webview's
      # headers. Without them the suite fails on a package that has no tests —
      # a confusing way to discover a build dependency.
      #
      # webview_go hardcodes `pkg-config: webkit2gtk-4.0` and Ubuntu 24.04 ships
      # only 4.1, so installing the 4.1 package alone satisfied nothing. The
      # alias below is what makes them meet. It is duplicated in desktop.yml on
      # purpose: that workflow runs only on a tag, and a shared step that had
      # drifted would be discovered during a release.
      - name: Linux webview headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          pcdir=$(pkg-config --variable pcfiledir webkit2gtk-4.1)
          printf 'Name: webkit2gtk-4.0\nDescription: alias for webkit2gtk-4.1\nVersion: 4.1\nRequires: webkit2gtk-4.1\n' \
            | sudo tee "$pcdir/webkit2gtk-4.0.pc" >/dev/null
          pkg-config --cflags webkit2gtk-4.0 >/dev/null && echo "ok: webkit2gtk-4.0 resolves"

      - name: Build the interface
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Typecheck the interface
        run: cd web && npx tsc --noEmit

      - name: go vet
        run: go vet ./...

      # The desktop command is a target CI otherwise never exercises: it sits
      # behind a cgo build tag, so a CGO_ENABLED=0 build compiles the stub
      # beside it and proves nothing. Building it here is what stops a release
      # from being the first thing to discover a typo in it — desktop.yml runs
      # only on a tag, which is far too late to find out.
      - name: The desktop command still compiles
        env:
          CGO_ENABLED: "1"
        run: go build -o /dev/null ./cmd/cogitorium-desktop

      # A dead in-page anchor neither 404s nor warns: the page just fails to
      # scroll. Twelve of them shipped at once because kramdown strips a
      # leading number out of a heading id and a numbered walkthrough is
      # exactly the shape that trips on it.
      - name: Documentation anchors
        run: python3 scripts/ci/check-docs-anchors.py

      - name: The release config still parses
        # Nothing validated .goreleaser.yaml until a tag was pushed, and by then
        # the release is half-published. Found the hard way: a description with
        # a colon in it broke the Helm chart, which HAS a lint job and failed
        # in ninety seconds — the same edit in this file would have waited for
        # a release to say so.
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: Formatting
        # gofmt -l prints what is unformatted and exits 0 either way, so the
        # check has to be the emptiness of its output.
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/node_modules' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted | head -60
            exit 1
          fi
          echo "ok: everything is formatted"

      # WITHOUT THIS, A WHOLE PACKAGE SILENTLY DID NOTHING.
      #
      # internal/contextstore drives a real contextd, and skips every test when
      # there is none — which is right on a laptop, where its absence is a fact
      # about the machine. Nothing here ever installed one, so in CI the package
      # skipped from end to end and reported ok. That is the same failure the
      # `file delete` gate already had once, one level up: a guard nobody
      # exercises is a guard that rots.
      #
      # The version comes from MinContextd, so this cannot drift from the floor
      # the product declares.
      - name: Install contextd, the Contextverse this build declares it needs
        run: sudo ./scripts/ci/install-contextd.sh /usr/local/bin

      - name: Test
        # -race, because the parts of this server most worth testing are the
        # concurrent ones: an SSE turn running while another request writes, the
        # egress broker parking a turn, the sandbox draining two pipes.
        run: go test ./... -count=1 -race

      # The browser suite: a real server, a real Chromium, no mocks.
      #
      # The Go tests above cannot see the thing this branch is actually
      # changing. Every step of turning React pages into templates has "nothing
      # visibly changed" as its success criterion, which is not a claim
      # anybody checks by hand across sixteen screens — and a net that only
      # runs when somebody remembers to run it is not a net.
      - name: Install Chromium for the browser tests
        run: cd web && npx playwright install --with-deps chromium

      - name: The interface, in a browser
        run: cd web && npm test

      # And a proof that the step above actually did something: a skip is not a
      # pass, and this package reporting ok while running nothing is precisely
      # the state this is here to prevent.
      - name: The context tests ran, rather than skipping
        run: |
          set -e
          go test ./internal/contextstore/ -count=1 -v > /tmp/contextstore.log 2>&1 || {
            cat /tmp/contextstore.log; exit 1
          }
          if grep -q -- "--- SKIP" /tmp/contextstore.log; then
            echo "FAIL: contextstore tests skipped — contextd is missing or too old:"
            grep -- "--- SKIP" /tmp/contextstore.log
            exit 1
          fi
          echo "ok: $(grep -c -- '--- PASS' /tmp/contextstore.log) context tests ran against $(contextd version)"

      - name: Coverage
        # Reported, not gated. A percentage threshold rewards tests that touch
        # lines, and the tests here are written to catch a rule being removed —
        # the two are not the same thing, and only one of them is worth having.
        run: |
          go test ./... -count=1 -coverprofile=coverage.out >/dev/null
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | sort -k3 -rn | head -20

      - name: Build
        run: go build -o bin/cogitorium ./cmd/cogitorium

      - name: The binary starts and answers
        run: |
          ./bin/cogitorium serve --data "$RUNNER_TEMP/cogitorium" --listen 127.0.0.1:8688 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8688/health >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8688/health
              # The UI has to be served too, not just the API — that is the
              # half a Go-only build would silently lose.
              curl -fsS http://127.0.0.1:8688/ | grep -q "<div id=\"root\">"
              echo "ok: API and interface both answer"
              exit 0
            fi
            sleep 1
          done
          echo "the server never became healthy" >&2
          exit 1

  cross:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    # Requirement 7 is three platforms. Compiling for all six targets on every
    # change is what keeps that true rather than aspirational — a Windows-only
    # break otherwise surfaces at release time.
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build the interface
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cogitorium:ci .
      - name: It starts, and Contextverse works inside it
        run: |
          CID=$(docker run -d -p 127.0.0.1:8688:8688 cogitorium:ci)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8688/health >/dev/null 2>&1 && break
            sleep 1
          done
          TOK=$(docker logs "$CID" 2>&1 | grep -oE 'cg-[a-zA-Z0-9-]+' | head -1)
          STATUS=$(curl -fsS -H "Authorization: Bearer $TOK" http://127.0.0.1:8688/api/v1/context/status)
          echo "$STATUS"
          # The image ships contextd and initialises its space on first start.
          # A container where context is unavailable is one where memory does
          # nothing, which is exactly the failure that looks like it worked.
          echo "$STATUS" | grep -q '"available":true' || { docker logs "$CID"; exit 1; }
          docker rm -f "$CID" >/dev/null

  helm:
    name: helm chart on a real cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the chart
        run: |
          helm lint deploy/helm/cogitorium

      # Rendering is not deploying. These four are refusals the chart makes at
      # template time, and a guard nobody exercises is a guard that rots.
      - name: The chart must refuse what cannot work
        run: |
          set -e
          TOK=$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 30)
          refuse() {
            if helm template cog deploy/helm/cogitorium --set auth.adminToken="$TOK" $1 >/dev/null 2>&1; then
              echo "FAIL: the chart accepted $1"; exit 1
            fi
            echo "ok: refused $1"
          }
          refuse "--set config.terminal=true"
          # A terminal is an interactive attachment and a gear Job is
          # run-to-completion, so it stays refused on kubernetes too — for a
          # different reason than it used to be.
          refuse "--set config.terminal=true --set config.sandbox=subprocess"
          # Egress is no longer refused in-cluster: gears run as Jobs, so there
          # IS a sandbox. It is still refused where there is not one.
          refuse "--set config.egress=true --set config.sandbox=subprocess"
          refuse "--set config.sandbox=kubernetes --set serviceAccount.automountServiceAccountToken=false"
          refuse "--set config.sandbox=docker"
          refuse "--set persistence.enabled=false"
          if helm template cog deploy/helm/cogitorium --set auth.adminToken=short >/dev/null 2>&1; then
            echo "FAIL: the chart accepted a short admin token"; exit 1
          fi
          echo "ok: refused a short admin token"
          if helm template cog deploy/helm/cogitorium --set auth.adminPassword=short >/dev/null 2>&1; then
            echo "FAIL: the chart accepted a short admin password"; exit 1
          fi
          echo "ok: refused a short admin password"
          # The password is GENERATED when none is given, and that is the
          # default path every operator takes. A render that produced no
          # admin-password would leave an install nobody can sign in to.
          helm template cog deploy/helm/cogitorium | grep -q "admin-password:" || {
            echo "FAIL: the default render carries no generated admin password"; exit 1
          }
          echo "ok: a password is generated when none is supplied"
          # And the valid shape must still render, or the guards are just noise.
          helm template cog deploy/helm/cogitorium --set auth.adminToken="$TOK" >/dev/null
          echo "ok: a valid configuration renders"
          # Egress with the default sandbox is now a working configuration, and
          # that is the half of this change worth asserting rather than assuming.
          helm template cog deploy/helm/cogitorium --set auth.adminToken="$TOK" --set config.egress=true >/dev/null
          echo "ok: egress renders on sandbox: kubernetes"

      - name: Build the image
        run: docker build -t cogitorium:ci .

      - uses: helm/kind-action@v1
        with:
          cluster_name: cogitorium

      - name: Install it
        run: |
          kind load docker-image cogitorium:ci --name cogitorium
          ADMIN_TOKEN=$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 32)
          echo "::add-mask::$ADMIN_TOKEN"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          helm install cogitorium deploy/helm/cogitorium \
            --namespace cogitorium --create-namespace \
            --set image.repository=cogitorium \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set auth.adminToken="$ADMIN_TOKEN" \
            --wait --timeout 5m

      - name: It answers, and Contextverse works inside it
        run: |
          set -e
          kubectl -n cogitorium port-forward svc/cogitorium 8688:8688 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8688/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8688/health
          # The interface, not just the API: a Go-only regression would pass a
          # health check and serve nothing.
          curl -fsS http://127.0.0.1:8688/ | grep -q '<div id="root">'
          echo "ok: API and interface both answer"

      - name: The generated admin password signs in, and is not in the log
        run: |
          set -e
          # Exactly what NOTES.txt tells an operator to run.
          PW=$(kubectl -n cogitorium get secret cogitorium-auth \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          echo "::add-mask::$PW"
          [ -n "$PW" ] || { echo "FAIL: the Secret carries no admin password"; exit 1; }
          echo "PW=$PW" >> "$GITHUB_ENV"

          # It is a working credential, not just a string in a Secret.
          curl -fsS -X POST http://127.0.0.1:8688/api/v1/login \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"admin\",\"password\":\"$PW\"}" | grep -q '"role":"admin"'
          echo "ok: the generated password signs the admin in"

          # And the install does not also stand there asking to be claimed,
          # which on a network-reachable address is what a stranger would do.
          curl -fsS http://127.0.0.1:8688/api/v1/setup | grep -q '"needs_setup":false'
          echo "ok: the install is claimed, so nobody else can claim it"

          # A credential in a pod log is readable by anyone with log access.
          if kubectl -n cogitorium logs deploy/cogitorium | grep -qF "$PW"; then
            echo "FAIL: the admin password appears in the pod log"; exit 1
          fi
          echo "ok: the password is not in the pod log"

          # Nor a token INSTEAD of it. The chart declines to print the password
          # in its own output on the grounds that install output reaches CI
          # logs; a bootstrap token in the pod log would be the same credential
          # somewhere worse, and would make that refusal theatre.
          if kubectl -n cogitorium logs deploy/cogitorium | grep -q 'admin token created'; then
            echo "FAIL: a bootstrap admin token was logged even though a password was supplied"; exit 1
          fi
          echo "ok: no admin token was logged either"

          # And the admin cannot put the install back to unclaimed, which is
          # what an empty password used to do: it is the same state NeedsSetup
          # reads as "nobody has taken this yet".
          T=$(curl -fsS -X POST http://127.0.0.1:8688/api/v1/login \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"admin\",\"password\":\"$PW\"}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8688/api/v1/users/1/password \
            -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"password":""}')
          [ "$CODE" = "400" ] || { echo "FAIL: clearing the admin password returned $CODE, want 400"; exit 1; }
          curl -fsS http://127.0.0.1:8688/api/v1/setup | grep -q '"needs_setup":false'
          echo "ok: the install cannot be pushed back to unclaimed"

      - name: An upgrade keeps the password rather than minting a new one
        run: |
          set -e
          # THE TRAP THIS GUARDS. randAlphaNum runs on every render, so a chart
          # that generated naively would put a fresh password in the Secret at
          # every upgrade — and the server only adopts one while the admin has
          # none, so from here on the Secret would advertise a value that does
          # not work. Nothing catches that except an actual upgrade.
          helm upgrade cogitorium deploy/helm/cogitorium \
            --namespace cogitorium \
            --set image.repository=cogitorium \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set auth.adminToken="$ADMIN_TOKEN" \
            --wait --timeout 5m

          AFTER=$(kubectl -n cogitorium get secret cogitorium-auth \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          echo "::add-mask::$AFTER"
          if [ "$AFTER" != "$PW" ]; then
            echo "FAIL: helm upgrade replaced the admin password, so the Secret now names one the server does not have"
            exit 1
          fi
          echo "ok: the upgrade kept the password"

          # The strategy is Recreate, so the upgrade replaced the pod and took
          # the port-forward with it. Every step after this one needs it back.
          pkill -f "port-forward svc/cogitorium" || true
          kubectl -n cogitorium port-forward svc/cogitorium 8688:8688 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8688/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8688/api/v1/login \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"admin\",\"password\":\"$PW\"}" | grep -q '"role":"admin"'
          echo "ok: it still signs in after the upgrade"

      - name: The seeded admin token works and was never logged
        run: |
          set -e
          curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" http://127.0.0.1:8688/api/v1/whoami | grep -q '"role":"admin"'
          echo "ok: the seeded token authenticates as admin"
          # The whole point of seeding it: a cluster log must not carry a
          # credential. This assertion is why the feature exists.
          if kubectl -n cogitorium logs deploy/cogitorium | grep -qF "$ADMIN_TOKEN"; then
            echo "FAIL: the admin token appears in the pod log"; exit 1
          fi
          echo "ok: the token is not in the pod log"
          STATUS=$(curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" http://127.0.0.1:8688/api/v1/context/status)
          echo "$STATUS"
          # The WHOLE log, not its tail. The entrypoint's account of what it did
          # with the context space is printed before the server starts, so a
          # tail is guaranteed to cut off the only lines that explain this
          # particular failure — which is exactly what happened.
          echo "$STATUS" | grep -q '"available":true' || { kubectl -n cogitorium logs deploy/cogitorium; exit 1; }
          echo "ok: Contextverse is available in the cluster"

      - name: A gear runs as a Job, and sees nothing but its own payload
        run: |
          set -e
          A="Authorization: Bearer $ADMIN_TOKEN"
          # A gear that reports what it can reach. If the mount is wrong it can
          # see the data volume — the database and the provider keys in it — and
          # this prints that rather than leaving it to be assumed.
          curl -fsS -X POST -H "$A" -H 'Content-Type: application/json' \
            http://127.0.0.1:8688/api/v1/gears -d '{
              "name":"probe","description":"Reports what it can reach.","runtime":"python",
              "entrypoint":"main.py",
              "files":[{"path":"main.py","content":"import os,glob\nprint(\"CWD\", os.getcwd())\nprint(\"HERE\", sorted(os.listdir(\".\")))\nprint(\"DATA\", os.path.isdir(\"/data\"))\nprint(\"DBS\", glob.glob(\"/data/*.db\") + glob.glob(\"../*.db\"))\n"}],
              "args_schema":"{\"type\":\"object\"}"}' >/dev/null
          OUT=$(curl -fsS -X POST -H "$A" -H 'Content-Type: application/json' \
            http://127.0.0.1:8688/api/v1/gears/1/run -d '{"args":{}}')
          echo "$OUT"
          echo "$OUT" | grep -q '"exit_code":0' || { echo "FAIL: the gear did not run"; exit 1; }
          echo "$OUT" | grep -q 'CWD /work' || { echo "FAIL: the gear did not start in its payload"; exit 1; }
          echo "$OUT" | grep -q 'DATA False' || { echo "FAIL: the gear can see the data volume"; exit 1; }
          echo "$OUT" | grep -q 'DBS \[\]' || { echo "FAIL: the gear can see a database"; exit 1; }
          echo "ok: a gear ran as a Job and saw only its own payload"
          # And it was a Job, not a subprocess. The Jobs are deleted when the run
          # ends, so this asks the server what backend it chose.
          #
          # Both spellings, because the chart runs the server with JSON logs and
          # this only ever matched the text ones. The step failed on an install
          # that had just done exactly what was asked of it: the payload
          # assertions above all passed, the log said backend kubernetes, and
          # the grep was looking for backend=kubernetes.
          kubectl -n cogitorium logs deploy/cogitorium \
            | grep -qE 'backend=kubernetes|"backend":"kubernetes"' \
            || { echo "FAIL: gears did not run as Kubernetes Jobs"; exit 1; }
          echo "ok: the sandbox backend is kubernetes"

      - name: One replica, and it cannot be raised
        run: |
          set -e
          test "$(kubectl -n cogitorium get deploy cogitorium -o jsonpath='{.spec.replicas}')" = "1"
          test "$(kubectl -n cogitorium get deploy cogitorium -o jsonpath='{.spec.strategy.type}')" = "Recreate"
          echo "ok: pinned to one replica with a Recreate strategy"

      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n cogitorium get all
          kubectl -n cogitorium describe pod -l app.kubernetes.io/name=cogitorium || true
          kubectl -n cogitorium logs deploy/cogitorium --tail=200 || true
