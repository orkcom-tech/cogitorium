name: release

# Cut a release from a tag. Everything downstream — Homebrew, Scoop, winget,
# the desktop installers — points at the artifacts this produces, so it runs
# first and the rest follow it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  # Keyless signing: cosign exchanges this for a short-lived Fulcio certificate
  # bound to this workflow's identity, so there is no private key to lose and a
  # verifier can ask "was this built by this repository's release workflow"
  # rather than "do I recognise this key".
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # GoReleaser's before-hook builds the interface, but installing its
      # dependencies here keeps the npm cache above doing something and fails
      # early rather than inside the release.
      - name: Interface dependencies
        run: cd web && npm ci --no-audit --no-fund

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: container image
    needs: goreleaser
    runs-on: ubuntu-latest
    # Because the alternative is what happened on v0.7.0: the arm64 half of the
    # build hung under QEMU and ran until GitHub's own six-hour ceiling killed
    # it, which reports as "cancelled" — a word that reads like somebody pressed
    # a button rather than like a failure worth looking at. The same build takes
    # about twenty-two minutes when it is healthy.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The Helm chart defaults image.repository to this path. Until now
      # nothing built or pushed it, so the documented `helm install` ended in
      # ImagePullBackOff — the chart was tested in CI against a locally built
      # image, which proved the chart and nothing about the image anyone else
      # would pull.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: the chart is as likely to land on a Graviton
          # or an arm laptop cluster as on an x86 node, and an image that only
          # runs on one of them is an image that fails at the worst moment.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: true

  packages:
    name: bump Homebrew and Scoop
    needs: goreleaser
    runs-on: ubuntu-latest
    # Only with a token: the tap and the bucket are separate repositories, and
    # a release that cannot reach them should say so rather than half-publish.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump the tap and the bucket
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [ -z "$PACKAGING_TOKEN" ]; then
            echo "PACKAGING_TOKEN is not set — skipping Homebrew and Scoop." >&2
            echo "The release itself is published; the tap and the bucket stay on the previous version." >&2
            exit 0
          fi
          ./scripts/ci/publish-packages.sh "${GITHUB_REF_NAME}"
