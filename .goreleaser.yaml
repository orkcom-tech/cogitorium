# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cogitorium

# The interface is embedded in the binary, so it has to exist before any Go
# build runs. `go:embed all:dist` matching nothing is a compile error, not a
# warning — which is deliberate, and which makes this hook load-bearing rather
# than a convenience.
before:
  hooks:
    - go mod tidy
    - sh -c "cd web && npm ci --no-audit --no-fund && npm run build"
    # Contextverse, fetched for all six targets so the artifacts can carry it.
    # Homebrew, Scoop and winget can name a dependency and have their package
    # manager act on it; a downloaded tarball and a .deb cannot say anything, so
    # for those two the only way to satisfy it is to be carrying it.
    #
    # It stages into build/ rather than dist/ because goreleaser cleans dist and
    # then refuses to continue if anything is in it — a before-hook that wrote
    # there aborts the release with "dist is not empty" even under --clean.
    - ./scripts/ci/fetch-contextd.sh

builds:
  - id: cogitorium
    main: ./cmd/cogitorium
    binary: cogitorium
    # No cgo: modernc.org/sqlite is a pure-Go SQLite precisely so this holds,
    # and it is what lets one machine cross-build all six targets. The desktop
    # shell is the exception and is built separately on native runners, because
    # a system webview cannot be cross-compiled.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/orkcom-tech/cogitorium/internal/version.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      # Apache 2.0 §4(c): the NOTICE travels with the work. An archive IS a
      # redistribution, so shipping the licence without it would put this
      # project in breach of its own terms on the first download.
      - NOTICE
      - README.md
      # contextd, beside cogitorium. Unpacking the archive gives you both
      # programs in one directory, and the server looks there before PATH — so
      # a tarball extracted into ~/bin is a working install rather than one
      # that reports context unavailable with the binary sitting next to it.
      #
      # src is templated and dst is NOT: a dst carrying a template ships a file
      # whose NAME is the template text. Hence one directory per target and
      # strip_parent, which puts the binary at the archive root under its own
      # name — contextd, or contextd.exe on Windows, without a conditional.
      - src: "build/contextd/{{ .Os }}_{{ .Arch }}/contextd*"
        strip_parent: true
        info:
          mode: 0755
      - src: build/contextd/LICENSE-contextverse
        dst: LICENSE-contextverse

checksum:
  name_template: checksums.txt

# Signatures, because a checksum file signs nothing.
#
# Whoever can replace a binary on the release page can replace checksums.txt
# beside it. The checksum proves the download was not corrupted in transit; it
# says nothing about who produced it.
#
# Keyless: cosign takes a short-lived certificate from Fulcio bound to the
# GitHub Actions identity that ran the release, and records the fact in the
# Rekor transparency log. No private key exists for anyone to lose, and the
# question a verifier can answer becomes "was this built by this repository's
# release workflow" rather than "do I recognise this key".
#
#   cosign verify-blob --signature checksums.txt.sig \
#     --certificate checksums.txt.pem \
#     --certificate-identity-regexp 'https://github.com/orkcom-tech/cogitorium/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    # The checksum file covers every artifact, so signing it signs the release.
    artifacts: checksum
    output: true

# What is actually inside each archive, in a format a scanner can read.
# Without one, "is this release affected by CVE-x" means rebuilding it and
# hoping the dependency graph has not moved since.
sboms:
  - id: archive
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  replace_existing_draft: true
  # A re-run must not fail on the work the first run already did.
  #
  # v0.7.0's image job was killed by GitHub's six-hour ceiling while goreleaser
  # had already finished. Re-running the workflow then failed on the FIRST
  # asset — "already_exists" — so the only way to retry the half that broke was
  # to retry the half that had not. Replacing an asset with a byte-identical
  # rebuild is the harmless case, and this is the one flag that makes a release
  # workflow safe to run twice.
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"
  header: |
    Cogitorium {{ .Tag }} — a modular workbench for deterministic workflows built on models.

    Install with Homebrew, Scoop, a Linux package, Docker, or the archive for
    your platform below.
  footer: |
    **Verifying a download**

    ```sh
    cosign verify-blob --signature checksums.txt.sig \
      --certificate checksums.txt.pem \
      --certificate-identity-regexp 'https://github.com/orkcom-tech/cogitorium/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum -c checksums.txt --ignore-missing
    ```

nfpms:
  - id: linux-packages
    package_name: cogitorium
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/orkcom-tech/cogitorium
    maintainer: ORKCOM <https://orkcom.com>
    description: A modular workbench for building deterministic, repeatable workflows that have models in them — agents, wiring, context, gears and pipelines, set by hand or by the orchestrator. Local-first, no telemetry.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    # No dependency declaration at all any more, because the package CARRIES
    # contextd. It said `recommends` before, on the sound reasoning that
    # contextd ships from its own GitHub releases rather than a distribution
    # repository — so `Depends` would make this package refuse to install on a
    # machine with no way to satisfy it. That argument rules out a hard
    # dependency; it does not rule out bringing the binary, which is what
    # actually leaves the operator with a working install.
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
    contents:
      - src: deploy/cogitorium.service
        dst: /usr/lib/systemd/system/cogitorium.service
        type: config
      # UNDER /usr/libexec, NOT /usr/bin. dpkg refuses to unpack a package that
      # would overwrite a file another package owns, so putting it on the
      # ordinary path would make this package and a future contextd package
      # mutually uninstallable. Out of the way, it is Cogitorium's own copy, and
      # the systemd unit points at it; someone who later installs contextd
      # properly gets theirs on PATH and nothing collides.
      - src: "build/contextd/linux_{{ .Arch }}/contextd"
        dst: /usr/libexec/cogitorium/contextd
        file_info:
          mode: 0755
      # Redistributed, so its licence travels with it.
      - src: build/contextd/LICENSE-contextverse
        dst: /usr/share/doc/cogitorium/LICENSE-contextverse
      # Same obligation as the archives and the image. Debian and RPM both
      # expect the licence under /usr/share/doc/<package> anyway.
      - src: LICENSE
        dst: /usr/share/doc/cogitorium/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/cogitorium/NOTICE

# Homebrew and Scoop are bumped after the release by
# scripts/ci/publish-packages.sh — see packaging/README.md. They are not
# generated here on purpose: the tap and the bucket are their own repositories
# with their own history, and a release that half-succeeds must not leave them
# pointing at artifacts that do not exist.
