ShortDescription: A modular workbench for building deterministic, repeatable workflows that have models in them — agents, wiring, context, gears and pipelines, set by hand or by the orchestrator. Local-first, no telemetry.
Description: >-
  Cogitorium is for building workflows that have models in them and still behave
  like workflows: as deterministic as the parts allow, the same from one run to
  the next, and flexible enough to be reshaped without being rebuilt. The agents,
  the wiring between them, the context each one carries, the tools they forge and
  the pipelines they serve are all yours to configure — by hand on the bench, or
  by telling the orchestrator, both writing to the same objects. A model per
  agent, per-agent token spend, and a record of what every run actually did,
  against which a task's stated conditions are checked. One binary with the
  interface embedded; it talks to the model providers you configure and to
  nothing else.
