<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cogitorium</title>
    <!--
      The medallion at every size, and deliberately over-supplied at the top.
      A tab is 16 or 32 CSS pixels but twice that in device pixels, and this
      artwork only resolves from about 48 real pixels up — so the browser is
      given big rasters and left to reduce them itself, which it does better
      than any pre-baked 16px bitmap of an illustration this detailed.
    -->
    <link rel="icon" sizes="16x16 32x32 48x48 64x64" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Two, because the app has a light look now and one near-black value
         painted the browser's own chrome the wrong colour around a paper
         interface. The media query is how theme-color varies; there is no
         light-dark() for a meta tag. -->
    <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
    <!--
      The hypermedia layer, served from the binary like everything else here.

      In the application's own document as well as the plugin shell's, because
      a drawer this server renders is swapped into THIS page: the workspace is
      still the client's, and the panels inside it are the server's. That seam
      is where the conversion is happening, and it needs both halves loaded.
    -->
    <script src="/cog/htmx.min.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
