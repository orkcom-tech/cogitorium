title: Cogitorium
description: >-
  A workbench for agentic development. Model catalog, workspaces of dedicated
  agents behind one orchestrator chat, blueprint wiring, and a persistent
  catalog of agent-forged tools. Local-first, no telemetry.

# No remote theme: the layout in _layouts/default.html is the whole site, so
# the page fetches nothing at build or at read time.
plugins: []

exclude:
  - assets/*.png~
