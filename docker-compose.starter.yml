# Cogitorium with a model of its own — the whole thing, in one command.
#
#   docker compose -f docker-compose.starter.yml up
#
# It brings up three things: Cogitorium (with Contextverse inside the same
# image), an Ollama container to think with, and a one-shot job that pulls the
# model and then exits. When it settles, open http://localhost:8688 — the
# provider is already registered, the model is already offered, and the
# orchestrator already has one. Nothing to type into a settings screen first.
#
# What you do next: make a workspace. It arrives with its orchestrator already
# thinking with the model above, so you can talk to it immediately. The AGENTS
# are not pre-made and could not be — an agent belongs to a workspace, and
# there is no workspace until you make one. You either draw them on the
# blueprint or, more usually, ask the orchestrator for them: creating worker
# agents and delegating to them is what it is for.
#
# THIS IS A STARTER. It is an example, not a deployment: one machine, one
# volume, a small model chosen because it fits on a laptop. Change it. Point it
# at a bigger model, at a GPU, at Anthropic instead — the file is short on
# purpose so that editing it is obvious.
#
# WHAT RUNS WHERE, because the answer is not what people assume.
#
# An agent is not a process. Every workspace is created with an orchestrator,
# and the agents you add beside it are rows with their own role, their own
# model and their own private memory — Cogitorium runs a turn for one when it
# has something to do, and nothing is sitting idle in between. Two agents built
# from the same instruction are two separate agents: separate memory, separate
# turns, separate model calls. Neither can reach into the other's work, and the
# only thing they can share is context, and only where somebody has said so.
#
# So there is one Cogitorium container here, not one per agent, and adding
# twenty agents adds twenty rows rather than twenty containers. What DOES get a
# container of its own is a gear: agent-authored code runs in the sandbox, one
# container per run, thrown away afterwards. On Kubernetes that is a Job per
# run — see deploy/helm/cogitorium.
#
# The inference server is the thing that actually costs: every agent's turn is
# a request to the model container, and they queue there. One Ollama with a
# 7-billion-parameter model will serve a handful of agents on a laptop and no
# more. That is the number to raise when it feels slow, and it is why this file
# keeps the model in a service of its own rather than hiding it inside the app.

name: cogitorium-starter

services:
  cogitorium:
    build: .
    depends_on:
      pull-model:
        condition: service_completed_successfully
    ports:
      # Loopback only. This server holds provider API keys and, on any other
      # address, requires a token for everything. Change deliberately.
      - "127.0.0.1:8688:8688"
    environment:
      # The compose network, not localhost: inside the container, localhost is
      # the container.
      COGITORIUM_LISTEN: "0.0.0.0:8688"
      # No Docker socket is mounted, so gears fall back to the subprocess
      # backend — which does not isolate them. Said here rather than left to be
      # discovered: to sandbox gears, mount /var/run/docker.sock and set
      # COGITORIUM_SANDBOX=docker, and understand that mounting that socket
      # gives this container control of the daemon.
      COGITORIUM_SANDBOX: "subprocess"
    volumes:
      - cogitorium-data:/data
      # Contextverse's own data, with its own history and its own backup story,
      # at contextd's default path because that is the one Cogitorium consults.
      - contextverse-space:/home/cogitorium/.context
      # The provider, the model and the orchestrator's choice. Read on first
      # start and never re-applied: change any of it on the Models screen and
      # your change stands.
      - ./deploy/starter/cogitorium.yaml:/data/config.yaml:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # Not published. Cogitorium reaches it by service name on the compose
    # network; an inference server with no authentication has no business on a
    # port. Add "127.0.0.1:11434:11434" if you want to talk to it yourself.
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # The model, fetched once. A separate one-shot service rather than an
  # entrypoint script, so `docker compose up` shows the download as its own
  # line with its own progress instead of a server that appears to hang.
  pull-model:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    # ONE argument to `sh -c`, which is why this is a list with a single block
    # scalar in it. Written as `command: >` it was a plain string, and compose
    # splits a string command on whitespace — so the container ran
    # `sh -c until ollama list ...`, the script was the word `until`, it exited
    # with a syntax error, and `service_completed_successfully` never came true.
    # Cogitorium then never started at all, which is the whole of what this file
    # is for.
    #
    # qwen2.5:7b — about 4.7 GB, and chosen because it calls tools reliably.
    # Tool calling is not optional here: delegation, gears and planboards are
    # all tool calls, and a model that cannot make one can only chat. Swap it
    # for something smaller if you are only proving the wiring works
    # (qwen2.5:0.5b is ~400 MB and still calls tools) or something bigger if
    # you have the memory — and change the model name in
    # deploy/starter/cogitorium.yaml to match.
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 1; done
        ollama pull qwen2.5:7b
    restart: "no"

volumes:
  cogitorium-data:
  contextverse-space:
  ollama-models:
